else if(form===1){/* dagger: symmetrical double-edged point */ctx.moveTo(-18,-13);ctx.lineTo(27,-13);ctx.lineTo(83,0);ctx.lineTo(27,13);ctx.lineTo(-18,13)}
else if(form===2){/* cleaver: broad rectangular blade with a squared tip */ctx.moveTo(-19,-12);ctx.lineTo(60,-14);ctx.lineTo(66,-11);ctx.lineTo(66,25);ctx.quadraticCurveTo(22,28,-19,20)}
else{/* saber: tapered curved blade */ctx.moveTo(-18,-10);ctx.quadraticCurveTo(30,-17,71,-25);ctx.quadraticCurveTo(85,-26,93,-18);ctx.quadraticCurveTo(54,3,14,9);ctx.lineTo(-18,8)}
ctx.closePath();ctx.fill();if(d){ctx.save();ctx.globalCompositeOperation='destination-out';for(let i=0;i<d.notches;i++){const xx=27+i*10;ctx.beginPath();ctx.arc(xx,form===2?25:form===0?6:9,1.5+(d.variant%3),0,7);ctx.fill()}ctx.restore();ctx.save();ctx.globalAlpha=.65;ctx.strokeStyle=knifeSkins[knifeSkin];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,0);ctx.quadraticCurveTo(30,d.curve*4,Math.min(68,d.bladeLength),d.curve*2);ctx.stroke();ctx.restore()}ctx.shadowBlur=0;const shine=ctx.createLinearGradient(0,-22,0,25);shine.addColorStop(0,'#ffffffb5');shine.addColorStop(.5,'#ffffff08');shine.addColorStop(1,knifeSkins[knifeSkin]);ctx.fillStyle=shine;ctx.fill();ctx.strokeStyle=knifeSkins[knifeSkin];ctx.lineWidth=1.4;ctx.stroke();drawKnifePattern();ctx.restore()}
function addCutEffects(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;for(let i=0;i<25;i++){const t=Math.random(),side=Math.random()<.5?-1:1;effects.push({x:a.x+dx*t,y:a.y+dy*t,vx:nx*side*rand(35,150)+rand(-25,25),vy:ny*side*rand(35,150)+rand(-35,35),life:rand(.16,.43),max:.43,r:rand(1.2,3.5)})}if(effects.length>160)effects.splice(0,effects.length-160)}
function drawKnifeEffects(){ctx.save();ctx.globalCompositeOperation='lighter';for(const e of effects){ctx.globalAlpha=clamp(e.life/e.max,0,1)*.85;ctx.fillStyle=knifeSkins[knifeSkin];ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=9;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()}ctx.restore()}

function render(){drawBackground();ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoomLevel,zoomLevel);ctx.translate(-W/2,-H/2);drawV8Extras();for(const p of pieces)drawPiece(p);for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=fruits[fruitIndex].flesh;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;drawKnifeEffects();
if(pointer){const a=pointer.start,b=pointer.end,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);ctx.save();ctx.lineCap='round';ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=13;ctx.strokeStyle=knifeSkins[knifeSkin];ctx.globalAlpha=.32;ctx.lineWidth=12*lineSize;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=.9;ctx.lineWidth=2.5*lineSize;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();drawKnife(b.x,b.y,Math.atan2(dy,dx)||0,.9*knifeSize)}
else if(trail.length>1){ctx.save();ctx.lineCap='round';for(let i=1;i<trail.length;i++){ctx.strokeStyle=knifeSkins[knifeSkin];ctx.globalAlpha=clamp(trail[i].life/.23,0,1)*.8;ctx.lineWidth=7*lineSize;ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}ctx.restore()}ctx.restore()}

function update(dt){if(slowTimer>0){slowTimer-=dt;dt*=.3}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.querySelector('#toast').textContent=''}for(const stain of stains)stain.life-=dt;stains=stains.filter(s=>s.life>0);for(const p of pieces){p.vy+=850*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;p.vx*=Math.exp(-1.3*dt);p.spin*=Math.exp(-1.4*dt);const maxR=Math.max(...p.poly.map(v=>Math.hypot(v.x,v.y)));const floor=plateY-25;if(p.y+maxR*.50>floor&&p.vy>0){p.y=floor-maxR*.50;p.vy*=-.23;p.vx*=.78;p.spin*=.65;p.wobble=.14}p.x=clamp(p.x,20,W-20);if(p.wobble)p.wobble=Math.max(0,p.wobble-dt)}for(let i=0;i<pieces.length;i++)for(let j=i+1;j<pieces.length;j++){const a=pieces[i],b=pieces[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,ra=Math.sqrt(area(a.poly)/Math.PI)*.55,rb=Math.sqrt(area(b.poly)/Math.PI)*.55,overlap=ra+rb-dist;if(overlap>0){const nx=dx/dist,ny=dy/dist;a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){const impulse=-relative*.35;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}}for(const p of particles){p.life-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);trail=trail.filter(p=>(p.life-=dt)>0);for(const e of effects){e.life-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=180*dt}effects=effects.filter(e=>e.life>0)}
function frame(t){try{const dt=Math.min((t-lastTime)/1000||0,.033);lastTime=t;update(dt);render();requestAnimationFrame(frame)}catch(e){showError(e)}}
function point(e){const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)*(W/Math.max(1,rect.width)),y=(e.clientY-rect.top)*(H/Math.max(1,rect.height));return {x:(x-W/2)/zoomLevel+W/2,y:(y-H/2)/zoomLevel+H/2}}
canvas.addEventListener('pointerdown',e=>{if(pointer)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);const start=point(e);audio();pointer={id:e.pointerId,start,end:{...start}}});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();pointer.end=point(e)});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();const start=pointer.start,end=point(e);pointer=null;const distance=Math.hypot(end.x-start.x,end.y-start.y);if(distance>=12){if(power==='Multi-Cut'&&save.ownedPowers.includes(power)&&multiLines.length<2){multiLines.push([start,end]);announce('Multi-Cut: '+multiLines.length+'/3 lines');return}if(multiLines.length){for(const [a,b] of multiLines)v8Cut(a,b);multiLines=[]}const didCut=v8Cut(start,end);playWhoosh();if(didCut){playSlice();addCutEffects(start,end)}trail=[{...start,life:.23},{...end,life:.23}]}});
canvas.addEventListener('pointercancel',e=>{if(pointer?.id===e.pointerId)pointer=null});

function fillSkins(id,items,kind){const host=document.querySelector('#'+id);host.replaceChildren();for(const [name,color] of Object.entries(items)){const button=document.createElement('button');button.textContent=name;button.style.borderColor=(kind==='knife'?knifeSkin:plateSkin)===name?'white':'transparent';button.addEventListener('click',()=>{if(kind==='knife'){knifeSkin=name;try{localStorage.setItem('cuto-knife',name)}catch(e){}}else{plateSkin=name;try{localStorage.setItem('cuto-plate',name)}catch(e){}}fillSkins('knifeOptions',knifeSkins,'knife');fillSkins('plateOptions',plateSkins,'plate')});host.appendChild(button)}}
