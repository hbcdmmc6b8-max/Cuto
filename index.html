function family(name){const n=name.toLowerCase();if(/orange|mandarin|tangerine|clementine|satsuma|kumquat|calamansi|grapefruit|pomelo|yuzu|sudachi|citron|bergamot|ugli|dekopon/.test(n))return 0;if(/watermelon/.test(n))return 1;if(/kiwi/.test(n))return 2;if(/lemon|lime|buddha/.test(n))return 3;if(/apple|pear|quince/.test(n))return 4;if(/berry|currant|cherry|grape|mulberry|lingon|bilberry|aronia/.test(n))return 6;if(/peach|plum|apricot|nectarine|mango/.test(n))return 8;if(/melon|cucumber|kiwano/.test(n))return 9;if(/dragon|pitaya/.test(n))return 10;return 11}

function circlePoly(r,n=64){return Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n;return {x:Math.cos(a)*r,y:Math.sin(a)*r}})}
function area(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function centroid(poly){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return {x:x/poly.length,y:y/poly.length}}

function fruitType(name){const n=name.toLowerCase();
if(/strawberry/.test(n))return 'strawberry';

if(/pomegranate/.test(n))return 'pomegranate';
if(/dragon fruit/.test(n))return 'dragon';
if(/passion fruit|granadilla/.test(n))return 'passion';
if(/papaya/.test(n))return 'papaya';
if(/fig/.test(n))return 'fig';
if(/kiwi/.test(n))return 'kiwi';
if(/watermelon/.test(n))return 'watermelon';
if(/melon|cucumber|kiwano/.test(n))return 'melon';
if(/orange|mandarin|tangerine|clementine|satsuma|kumquat|calamansi|grapefruit|pomelo|lemon|lime|yuzu|sudachi|citron|bergamot|ugli|dekopon|buddha/.test(n))return 'citrus';

if(/peach|nectarine|apricot|plum|damson|cherry|mango|lychee|longan|rambutan|olive|date|jujube|loquat/.test(n))return 'stone';

if(/berry|currant|mulberry|lingon|bilberry|aronia|acerola|jabuticaba/.test(n))return 'berry';

function showError(error){const box=document.getElementById('game-error')||document.createElement('pre');box.id='game-error';box.style.cssText='position:fixed;top:30%;left:5%;width:90%;white-space:pre-wrap;background:#5b1b35;color:white;padding:16px;border-radius:12px;z-index:20;font:13px monospace';box.textContent='Cuto rendering error: '+String(error&&error.stack||error);document.body.appendChild(box)}
window.addEventListener('error',e=>showError(e.error||e.message));
