<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#171426"><title>Cuto — 2D Fruit Slicing</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171426;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(16px,env(safe-area-inset-top));left:20px;pointer-events:none}h1{margin:0;font-size:30px;letter-spacing:2px}small{color:#d5c7df}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px}button{border:0;border-radius:18px;padding:15px 24px;font-weight:800;font-size:16px;background:#ffb95d;color:#37213b;box-shadow:0 5px 0 #ad6635;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 2px 0 #ad6635}#reset{background:#f3e7df;box-shadow:0 5px 0 #a79aa2}</style></head>
<body><canvas id="game"></canvas><header><h1>CUTO</h1><small>Swipe through the fruit to slice it</small></header><div class="controls"><button id="reset">Reset fruit</button><button id="next">Next fruit →</button></div>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,fruitIndex=0,pieces=[],particles=[],trail=[],pointer=null,lastTime=0,plateY=0;
const fruits=[
{name:'Orange',skin:'#f28a20',flesh:'#ffb52d',core:'#fff0aa',seed:'#fff2c8',radius:104},
{name:'Watermelon',skin:'#258b55',flesh:'#f04e65',core:'#f87683',seed:'#40282c',radius:114},
{name:'Kiwi',skin:'#93723b',flesh:'#9bd44b',core:'#e7f7b2',seed:'#282b20',radius:102},
{name:'Lemon',skin:'#e8c62e',flesh:'#f5e477',core:'#fff6bc',seed:'#f5eac8',radius:101},
{name:'Apple',skin:'#e44a53',flesh:'#f5e9b2',core:'#f3d78c',seed:'#75472f',radius:107},
{name:'Lime',skin:'#60aa39',flesh:'#a9d957',core:'#e7f4a6',seed:'#fff6c4',radius:100}
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);plateY=H*.69;if(pieces.length===0)spawn(false)}
addEventListener('resize',resize);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function circlePoly(r,n=64){return Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n;return {x:Math.cos(a)*r,y:Math.sin(a)*r}})}
function area(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function centroid(poly){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return {x:x/poly.length,y:y/poly.length}}
function bounds(poly){let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;for(const p of poly){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}return {x0,x1,y0,y1}}
function makeTexture(f){const c=document.createElement('canvas');c.width=c.height=320;const g=c.getContext('2d'),cx=160,cy=160,r=144;g.clearRect(0,0);g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle=f.skin;g.fill();g.beginPath();g.arc(cx,cy,r-9,0,7);g.fillStyle=f.core;g.fill();g.beginPath();g.arc(cx,cy,r-17,0,7);g.fillStyle=f.flesh;g.fill();
const grad=g.createRadialGradient(108,98,12,160,160,150);grad.addColorStop(0,'#ffffff66');grad.addColorStop(1,'#0000003d');g.fillStyle=grad;g.beginPath();g.arc(cx,cy,r-17,0,7);g.fill();
if(['Orange','Lemon','Lime'].includes(f.name)){for(let i=0;i<10;i++){const a=i*Math.PI/5;g.strokeStyle='#fff8d0a8';g.lineWidth=3;g.beginPath();g.moveTo(cx+Math.cos(a)*12,cy+Math.sin(a)*12);g.lineTo(cx+Math.cos(a)*(r-18),cy+Math.sin(a)*(r-18));g.stroke()}g.fillStyle=f.core;g.beginPath();g.arc(cx,cy,12,0,7);g.fill()}
else if(f.name==='Kiwi'){g.fillStyle=f.core;g.beginPath();g.ellipse(cx,cy,36,43,0,0,7);g.fill();for(let i=0;i<30;i++){const a=i*2*Math.PI/30;g.fillStyle=f.seed;g.beginPath();g.ellipse(cx+Math.cos(a)*54,cy+Math.sin(a)*54,2.5,5,a,0,7);g.fill()}}
else {for(let i=0;i<13;i++){const a=i*2*Math.PI/13;const rr=rand(45,105);g.fillStyle=f.seed;g.beginPath();g.ellipse(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,3,5,a,0,7);g.fill()}}
for(let i=0;i<240;i++){const x=rand(-r,r),y=rand(-r,r);if(x*x+y*y>(r-20)**2)continue;g.fillStyle=i%3?'#ffffff18':'#6d30250c';g.beginPath();g.arc(cx+x,cy+y,rand(.5,2),0,7);g.fill()}return c}
const textures=fruits.map(makeTexture);
function spawn(advance=true){if(advance)fruitIndex=(fruitIndex+1)%fruits.length;pieces=[];particles=[];trail=[];const r=Math.min(fruits[fruitIndex].radius,W*.30,H*.20);pieces.push({poly:circlePoly(r),x:W/2,y:H*.44,vx:0,vy:0,angle:0,spin:0,scale:r/144,depth:0});}
function clip(poly,a,b,side){const out=[];const cross=p=>(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x);for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],dp=cross(p)*side,dq=cross(q)*side;if(dp>=-1e-7)out.push({...p});if((dp<0&&dq>0)||(dp>0&&dq<0)){const t=dp/(dp-dq);out.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return out}
function local(p,body){const dx=p.x-body.x,dy=p.y-body.y,c=Math.cos(-body.angle),s=Math.sin(-body.angle);return {x:dx*c-dy*s,y:dx*s+dy*c}}
function cut(a,b){const len=Math.hypot(b.x-a.x,b.y-a.y);if(len<10)return;const next=[];let hits=0;for(const p of pieces){if(p.depth>=9||area(p.poly)<100){next.push(p);continue}const aa=local(a,p),bb=local(b,p);const left=clip(p.poly,aa,bb,1),right=clip(p.poly,aa,bb,-1);if(left.length<3||right.length<3||area(left)<70||area(right)<70){next.push(p);continue}
const c1=centroid(left),c2=centroid(right),parent=centroid(p.poly),ang=p.angle,ca=Math.cos(ang),sa=Math.sin(ang),normal={x:-(b.y-a.y)/len,y:(b.x-a.x)/len};for(const [poly,c,dir] of [[left,c1,1],[right,c2,-1]]){const dx=c.x-parent.x,dy=c.y-parent.y;next.push({poly:poly.map(v=>({x:v.x-c.x,y:v.y-c.y})),x:p.x+dx*ca-dy*sa+normal.x*dir*2,y:p.y+dx*sa+dy*ca+normal.y*dir*2,vx:p.vx+normal.x*dir*rand(75,125),vy:p.vy+normal.y*dir*rand(65,110)-65,angle:p.angle,spin:p.spin+dir*rand(.8,2.5),scale:p.scale,depth:p.depth+1,texOffset:{x:(p.texOffset?.x||0)+c.x,y:(p.texOffset?.y||0)+c.y}})}
hits++;for(let i=0;i<13;i++)particles.push({x:(a.x+b.x)/2+rand(-20,20),y:(a.y+b.y)/2+rand(-20,20),vx:rand(-130,130),vy:rand(-220,-30),life:rand(.3,.75),size:rand(2,6)})}
pieces=next;if(hits&&navigator.vibrate)navigator.vibrate(12)}
function path(poly){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath()}
function drawPiece(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);path(p.poly);ctx.save();ctx.clip();const tex=textures[fruitIndex],r=fruits[fruitIndex].radius,off=p.texOffset||{x:0,y:0};ctx.drawImage(tex,-r-off.x,-r-off.y,2*r,2*r);ctx.restore();ctx.strokeStyle='#fff5d470';ctx.lineWidth=1.7;path(p.poly);ctx.stroke();ctx.restore()}
function drawBackground(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#211b36');bg.addColorStop(1,'#47314a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff09';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(W*(i%4+.5)/4,H*(Math.floor(i/4)+.4)/3,30+i*7,0,7);ctx.fill()}const pw=Math.min(W*.84,410);ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(W/2,plateY+19,pw*.50,42,0,0,7);ctx.fill();ctx.fillStyle='#cbb6c6';ctx.beginPath();ctx.ellipse(W/2,plateY,pw*.50,48,0,0,7);ctx.fill();ctx.fillStyle='#f6e9e1';ctx.beginPath();ctx.ellipse(W/2,plateY-5,pw*.45,37,0,0,7);ctx.fill();ctx.strokeStyle='#d8c6d0';ctx.lineWidth=4;ctx.stroke()}
function render(){drawBackground();for(const p of pieces)drawPiece(p);for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=fruits[fruitIndex].flesh;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;if(trail.length>1){ctx.lineCap='round';for(let i=1;i<trail.length;i++){ctx.strokeStyle='rgba(255,244,218,'+(i/trail.length*.8)+')';ctx.lineWidth=2+i/trail.length*7;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}}}
function update(dt){for(const p of pieces){p.vy+=850*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;p.vx*=Math.exp(-1.3*dt);p.spin*=Math.exp(-1.4*dt);const maxR=Math.max(...p.poly.map(v=>Math.hypot(v.x,v.y)));const floor=plateY-25;if(p.y+maxR*.50>floor&&p.vy>0){p.y=floor-maxR*.50;p.vy*=-.23;p.vx*=.78;p.spin*=.65}p.x=clamp(p.x,20,W-20)}for(const p of particles){p.life-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);trail=trail.filter(p=>(p.life-=dt)>0)}
function frame(t){const dt=Math.min((t-lastTime)/1000||0,.033);lastTime=t;update(dt);render();requestAnimationFrame(frame)}
function point(e){const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer={id:e.pointerId,last:point(e)};trail.push({...pointer.last,life:.18})});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();const p=point(e),prev=pointer.last;cut(prev,p);trail.push({...p,life:.18});pointer.last=p});
function end(e){if(pointer?.id===e.pointerId)pointer=null}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.querySelector('#next').addEventListener('click',()=>spawn(true));document.querySelector('#reset').addEventListener('click',()=>spawn(false));
resize();spawn(false);requestAnimationFrame(frame);
</script></body></html>
