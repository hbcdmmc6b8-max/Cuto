-radius:22px;padding:18px;box-shadow:0 30px 90px #0009;touch-action:pan-y}#sheet h2{margin:0 0 6px;font-size:24px}#sheet p{color:var(--muted);line-height:1.5}#sheet button{width:100%;text-align:left;margin:5px 0}#sheet .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff15}#sheet .row button{width:auto;white-space:nowrap}#sheet input,#sheet select{width:100%;background:#14182b;color:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}#sheet .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}#sheet .chips button{width:auto;margin:0}.hint{font-size:12px;color:var(--muted)}#toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:5;max-width:75vw;padding:9px 14px;border-radius:12px;background:#151a2be8;border:1px solid #ffffff2e;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}#toast.show{opacity:1}#error{display:none;position:fixed;inset:20% 5% auto;z-index:30;background:#6e2635;color:white;padding:16px;border-radius:14px;white-space:pre-wrap}#error:not(:empty){display:block}@media(max-width:390px){#ratings{width:77px;right:4px}.rating{font-size:9px;padding:5px 4px}#actions button{padding:10px 5px;font-size:12px}#hud strong{font-size:17px}#hud .panel{padding:7px 9px}}
</style></head><body><canvas id="game" aria-label="Fruit slicing game"></canvas><div id="hud"><div class="panel"><strong>CUTO <span style="color:var(--accent)">21</span></strong><small id="subtitle">Rebirth • Classic</small></div><div class="panel"><strong id="wallet">0 ◈</strong><small id="fruitLabel">Apple</small></div></div><div id="ratings"><div class="rating">PERFECT <b id="perfect">0</b></div><div class="rating">GREAT <b id="great">0</b></div><div class="rating">GOOD <b id="good">0</b></div><div class="rating">CUT <b id="cut">0</b></div></div><div id="actions"><button id="previous">← Fruit</button><button id="reset">↻ Reset</button><button id="power">✦ Power</button><button id="next">Fruit →</button><button id="menu" class="primary">☰ Menu</button></div><div id="toast" role="status" aria-live="polite"></div><div id="modal" hidden><section id="sheet" role="dialog" aria-modal="true" aria-label="Cuto menu"></section></div><pre id="error"></pre>
<script>
'use strict';
/* CUTO 21.0 REBIRTH: standalone, versioned client save. Legacy v8 data is never loaded. */
const VERSION='21.0',SAVE_KEY='cuto-rebirth-v21-save',RESET_EPOCH='2026-11-16-rebirth';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),modal=$('modal'),sheet=$('sheet');
const FRUITS=[
{name:'Apple',skin:'#d63d4b',flesh:'#ffe8ad',core:'#f9c27a',juice:'#f6c16c',size:90,tough:.85,shape:'round',seed:5},
{name:'Orange',skin:'#ff9e38',flesh:'#ffd978',core:'#fff0b1',juice:'#ffba44',size:94,tough:.75,shape:'round',seed:9},
{name:'Watermelon',skin:'#368c59',flesh:'#f35670',core:'#fbd5a4',juice:'#fa6681',size:136,tough:1.7,shape:'oval',seed:18},
{name:'Kiwi',skin:'#8d673f',flesh:'#a6d663',core:'#f2ebc5',juice:'#c1e679',size:82,tough:.9,shape:'round',seed:22},
{name:'Lemon',skin:'#eecb48',flesh:'#fff2a0',core:'#fff7d4',juice:'#fce68a',size:86,tough:.9,shape:'oval',seed:7},
{name:'Strawberry',skin:'#d73b61',flesh:'#ff8aa2',core:'#fff0d8',juice:'#fa6384',size:76,tough:.55,shape:'round',seed:26},
{name:'Dragonfruit',skin:'#d65d9f',flesh:'#f5f0e9',core:'#faf8ed',juice:'#eab6d7',size:106,tough:1.15,shape:'oval',seed:36},
{name:'Pineapple',skin:'#bca047',flesh:'#ffdf75',core:'#ffeeb1',juice:'#eac45d',size:120,tough:1.5,shape:'oval',seed:18},
{name:'Blueberry',skin:'#5364ae',flesh:'#ac9bd6',core:'#ddd0ef',juice:'#8c7ac7',size:70,tough:.5,shape:'round',seed:12},
{name:'Mango',skin:'#e7a347',flesh:'#ffc467',core:'#ffe8a6',juice:'#ffbb59',size:108,tough:1.05,shape:'oval',seed:1},
{name:'Pear',skin:'#a8c65e',flesh:'#f6e8ad',core:'#e2d29b',juice:'#dbe39a',size:94,tough:.8,shape:'oval',seed:6},
{name:'Coconut',skin:'#856144',flesh:'#f6f2e7',core:'#fffdf4',juice:'#ecf1ed',size:115,tough:1.9,shape:'round',seed:3}
];
const KNIVES=[
{name:'Classic',price:0,sharp:1,color:'#cbd9e9',handle:'#7c513a',style:0},
{name:'Sapphire',price:120,sharp:1.2,color:'#80d6fa',handle:'#204d76',style:1},
{name:'Ember',price:250,sharp:1.35,color:'#ff9a61',handle:'#7e3b3b',style:2},
{name:'Jade',price:420,sharp:1.5,color:'#8be8b4',handle:'#2b6350',style:3},
{name:'Starlight',price:650,sharp:1.7,color:'#e8d6ff',handle:'#50417c',style:4},
{name:'Solar',price:950,sharp:1.9,color:'#ffdc83',handle:'#76552a',style:5},
{name:'Obsidian',price:1350,sharp:2.15,color:'#a6a5c4',handle:'#29253e',style:6},
{name:'Aurora',price:1900,sharp:2.4,color:'#a1f3e5',handle:'#4b527d',style:7}
];
const PLATES=[
{name:'Ceramic',price:0,outer:'#e3d9df',inner:'#f7f0e9',pattern:0},
{name:'Wood',price:90,outer:'#8c603c',inner:'#c49a64',pattern:1},
{name:'Marble',price:220,outer:'#9aa4b9',inner:'#e0e5f0',pattern:2},
{name:'Onyx',price:450,outer:'#242438',inner:'#5c6079',pattern:3},
{name:'Aurora',price:850,outer:'#458e9a',inner:'#b5ece7',pattern:4}
];
const POWERS=[
{name:'None',price:0,description:'Pure slicing.'},
{name:'Precision Focus',price:140,description:'Perfect rating on the next three cuts.'},
{name:'Time Warp',price:240,description:'Slows fruit physics for eight seconds.'},
{name:'Fruit Storm',price:350,description:'Adds four extra whole fruits.'},
{name:'Golden Touch',price:450,description:'Triple slice rewards for fifteen seconds.'},
{name:'Gravity Lift',price:540,description:'Launches every piece into the air.'},
{name:'Frostbite',price:650,description:'Freezes moving pieces for four seconds.'},
{name:'Ember Trail',price:800,description:'Adds a fiery trail for twelve seconds.'}
];
const RELEASES=[{version:'21.0',title:'REBIRTH — Total Game Rebuild',changes:['Rebuilt the game as a clean standalone canvas engine and redesigned all menus and mobile controls','Factory reset: entirely new save namespace; previous currency, unlocks, achievements and mastery are not imported','Replaced obsolete RNG and blunt systems with a curated, deterministic fruit/knife/plate/power collection','Rebuilt polygon slicing, toughness, fruit interiors, juice particles, touch input and physical collisions','Added persistent side accuracy counters, precision challenges, destruction lab, weapon mastery and settings','Reworked shop with clear ownership and equip actions; added recovery controls and a reset confirmation','Refreshed offline cache and simplified error handling']}];
const fresh=()=>({epoch:RESET_EPOCH,cutos:0,fruit:0,knife:'Classic',plate:'Ceramic',power:'None',ownedKnives:['Classic'],ownedPlates:['Ceramic'],ownedPowers:['None'],stats:{perfect:0,great:0,good:0,cut:0,total:0},mastery:{},achievements:[],settings:{sound:true,particles:true,reducedMotion:false},challenge:'none',challengeClaimed:false});
function load(){try{const value=JSON.parse(localStorage.getItem(SAVE_KEY));if(value&&value.epoch===RESET_EPOCH&&typeof value.cutos==='number'){const base=fresh();return {...base,...value,stats:{...base.stats,...value.stats},settings:{...base.settings,...value.settings},mastery:value.mastery&&typeof value.mastery==='object'?value.mastery:{}}}}catch(e){}return fresh()}
let save=load();function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){toast('Storage unavailable: progress may not persist')}}
let W=0,H=0,dpr=1,pieces=[],particles=[],trail=[],pointer=null,lastTime=0,toastUntil=0,toastMessage='',effectUntil=0,focusCuts=0,freezeUntil=0,slowUntil=0,fireUntil=0,goldUntil=0,mode='classic',challengeDone=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function resize(){const rect=canvas.getBoundingClientRect();W=Math.max(300,rect.width);H=Math.max(300,rect.height);dpr=Math.min(window.devicePixelRatio||1,save.settings.reducedMotion?1:2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function toast(message){toastMessage=message;toastUntil=performance.now()+1600;const el=$('toast');el.textContent=message;el.classList.add('show')}
function updateHUD(){ $('wallet').textContent=Math.floor(save.cutos).toLocaleString()+' ◈';$('fruitLabel').textContent=FRUITS[save.fruit].name;$('subtitle').textContent='Rebirth • '+(mode==='lab'?'Destruction Lab':mode==='challenge'?'Precision Challenge':'Classic');for(const key of ['perfect','great','good','cut'])$(key).textContent=save.stats[key]||0;$('power').textContent=save.power==='None'?'✦ Power':'✦ '+save.power}
function polygon(radius,n=36){return Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n;return{x:Math.cos(a)*radius,y:Math.sin(a)*radius}})}
function polyArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return Math.abs(a)/2}
function centroid(poly){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return{x:x/poly.length,y:y/poly.length}}
function split(poly,a,b){const dx=b.x-a.x,dy=b.y-a.y;function clip(sign){const out=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],dp=sign*(dx*(p.y-a.y)-dy*(p.x-a.x)),dq=sign*(dx*(q.y-a.y)-dy*(q.x-a.x));if(dp>=-1e-6)out.push(p);if((dp<0&&dq>0)||(dp>0&&dq<0)){const t=dp/(dp-dq);out.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return out}return[clip(1),clip(-1)]}
function makePiece(x,y,r,fruit,whole=true){return{x,y,vx:rand(-12,12),vy:0,angle:0,spin:rand(-.15,.15),poly:polygon(r),fruit,whole,r,rest:0,cracks:0}}
function spawn(){pieces=[];particles=[];trail=[];challengeDone=false;const f=FRUITS[save.fruit],r=Math.min(f.size*.5,W*.28,H*.21);pieces.push(makePiece(W*.5,H*.42,r,save.fruit));if(mode==='challenge')save.challengeClaimed=false;updateHUD()}
function switchFruit(step){save.fruit=(save.fruit+step+FRUITS.length)%FRUITS.length;persist();spawn()}
function masteryLevel(){return 1+Math.floor(Math.sqrt((save.mastery[save.knife]||0)/12))}
function rewardSlice(rating,areaRatio){if(mode==='lab')return;const key=rating>=.92?'perfect':rating>=.75?'great':rating>=.52?'good':'cut';save.stats[key]++;save.stats.total++;let amount=Math.round((key==='perfect'?12:key==='great'?8:key==='good'?5:3)*clamp(areaRatio,.4,1.2));if(performance.now()<goldUntil)amount*=3;save.cutos+=amount;save.mastery[save.knife]=(save.mastery[save.knife]||0)+1;updateHUD();persist()}
function juice(x,y,fruit,count=18){if(!save.settings.particles)return;const f=FRUITS[fruit];for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),speed=rand(25,220);particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-55,life:rand(.5,1.4),r:rand(1.5,4),color:f.juice})}if(particles.length>420)particles.splice(0,particles.length-420)}
function trySlice(a,b){if(!a||!b)return;const length=Math.hypot(b.x-a.x,b.y-a.y);if(length<18)return;const knife=KNIVES.find(k=>k.name===save.knife)||KNIVES[0],results=[];let cuts=0;
for(const p of pieces){const localA={x:a.x-p.x,y:a.y-p.y},localB={x:b.x-p.x,y:b.y-p.y},[one,two]=split(p.poly,localA,localB),oldArea=polyArea(p.poly),area1=one.length>2?polyArea(one):0,area2=two.length>2?polyArea(two):0;if(area1<oldArea*.055||area2<oldArea*.055){results.push(p);continue}
const toughness=FRUITS[p.fruit].tough*(p.whole?1:.65),speed=pointer?.speed||700,force=knife.sharp*(.8+Math.min(1.4,speed/650))*(1+Math.min(1,masteryLevel()*.025));
if(force<toughness){p.cracks=Math.min(6,p.cracks+1);p.vx+=(b.x-a.x)*.06;p.vy-=25;results.push(p);juice((a.x+b.x)/2,(a.y+b.y)/2,p.fruit,5);continue}
const ratio=Math.min(area1,area2)/Math.max(area1,area2),rating=focusCuts>0?1:ratio;if(focusCuts>0)focusCuts--;
for(const [poly,side] of [[one,-1],[two,1]]){const c=centroid(poly),np={...p,poly:poly.map(v=>({x:v.x-c.x,y:v.y-c.y})),x:p.x+c.x,y:p.y+c.y,vx:p.vx+side*rand(45,95),vy:p.vy-rand(45,95),spin:p.spin+side*rand(.5,1.5),whole:false,rest:0};results.push(np)}
juice((a.x+b.x)/2,(a.y+b.y)/2,p.fruit,22);rewardSlice(rating,oldArea/(Math.PI*(p.r||40)**2));cuts++;
}
if(cuts){pieces=results.slice(0,70);if(mode==='challenge'&&!save.challengeClaimed){const target=save.challenge==='halves'?2:save.challenge==='quarters'?4:8;const valid=pieces.length===target&&pieces.every(p=>!p.whole);if(valid){const areas=pieces.map(p=>polyArea(p.poly)),ratio=Math.min(...areas)/Math.max(...areas);if(ratio>.68){save.cutos+=target*20;save.challengeClaimed=true;persist();toast('Challenge complete! +'+target*20+' ◈')}}}if(mode!=='challenge')toast(cuts+' slice'+(cuts===1?'':'s')+' • +Cutos');updateHUD()}else pieces=results}
function applyPower(){const now=performance.now(),p=save.power;if(p==='None'){toast('Equip a power from the shop');return}if(p==='Precision Focus'){focusCuts=3;toast('Next 3 cuts: PERFECT')}else if(p==='Time Warp'){slowUntil=now+8000;toast('Time Warp: 8 seconds')}else if(p==='Fruit Storm'){for(let i=0;i<4;i++){const f=save.fruit;const q=makePiece(rand(W*.2,W*.8),rand(H*.15,H*.45),Math.min(FRUITS[f].size*.38,W*.15),f);q.vy=rand(-80,30);pieces.push(q)}toast('Fruit Storm!')}else if(p==='Golden Touch'){goldUntil=now+15000;toast('Triple rewards: 15 seconds')}else if(p==='Gravity Lift'){for(const q of pieces){q.vy-=rand(220,380);q.rest=0}toast('Gravity Lift!')}else if(p==='Frostbite'){freezeUntil=now+4000;toast('Frozen: 4 seconds')}else if(p==='Ember Trail'){fireUntil=now+12000;toast('Ember Trail: 12 seconds')} }
function openMenu(title,description=''){sheet.replaceChildren();const h=document.createElement('h2');h.textContent=title;sheet.append(h);if(description){const p=document.createElement('p');p.textContent=description;sheet.append(p)}modal.hidden=false}
function addButton(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.classList.add('primary');b.addEventListener('click',fn);sheet.append(b);return b}
function closeMenu(){modal.hidden=true}
function home(){openMenu('Cuto 21.0 • Rebirth','A clean beginning. Every player starts from zero on this new version.');addButton('▶ Resume slicing',closeMenu,true);addButton('🍎 Choose fruit',fruitMenu);addButton('🗡 Knife shop',()=>shop('knife'));addButton('◯ Plate shop',()=>shop('plate'));addButton('✦ Powers',()=>shop('power'));addButton('◎ Precision challenges',challenges);addButton('◈ Destruction lab',labMenu);addButton('★ Weapon mastery',masteryMenu);addButton('⚙ Settings',settingsMenu);addButton('☰ Changelog',changelog)}
function fruitMenu(){openMenu('Fruit collection','Every fruit is unlocked. No rolls, rarities, markets or RNG.');const input=document.createElement('input');input.placeholder='Search fruits';sheet.append(input);const host=document.createElement('div');sheet.append(host);function fill(){host.replaceChildren();FRUITS.forEach((f,i)=>{if(!f.name.toLowerCase().includes(input.value.toLowerCase()))return;const b=document.createElement('button');b.textContent=(save.fruit===i?'✓ ':'')+f.name+' • Toughness '+f.tough.toFixed(2);b.onclick=()=>{save.fruit=i;persist();spawn();closeMenu()};host.append(b)})}input.oninput=fill;fill();addButton('← Main menu',home)}
function shop(kind){const catalog=kind==='knife'?KNIVES:kind==='plate'?PLATES:POWERS,ownedKey=kind==='knife'?'ownedKnives':kind==='plate'?'ownedPlates':'ownedPowers';openMenu(kind==='knife'?'Knife Workshop':kind==='plate'?'Plate Gallery':'Power Workshop','Balance: '+Math.floor(save.cutos)+' ◈ • Earn currency by slicing.');for(const item of catalog){const row=document.createElement('div');row.className='row';const label=document.createElement('span');const selected=save[kind]===item.name,owned=save[ownedKey].includes(item.name);label.textContent=item.name+(item.sharp?' • '+item.sharp.toFixed(2)+'× sharpness':'')+(item.description?' • '+item.description:'');const b=document.createElement('button');b.textContent=selected?'Equipped':owned?'Equip':'Buy '+item.price+' ◈';b.disabled=selected||(!owned&&save.cutos<item.price);b.onclick=()=>{if(!owned){save.cutos-=item.price;save[ownedKey].push(item.name)}save[kind]=item.name;persist();updateHUD();shop(kind)};row.append(label,b);sheet.append(row)}addButton('← Main menu',home)}
function challenges(){openMenu('Precision challenges','Cut the selected fruit into equal-sized pieces. A successful attempt awards Cutos.');for(const [key,name] of [['halves','Two equal halves'],['quarters','Four equal quarters'],['eighths','Eight equal eighths']])addButton(name,()=>{mode='challenge';save.challenge=key;save.challengeClaimed=false;persist();spawn();closeMenu()});addButton('Return to Classic',()=>{mode='classic';spawn();closeMenu()});addButton('← Main menu',home)}
function labMenu(){openMenu('Destruction Lab','Experiment with physics. No Cutos or mastery are awarded in the lab.');addButton('Enter lab',()=>{mode='lab';spawn();closeMenu()},true);addButton('Compress fruit',()=>{mode='lab';for(const p of pieces){p.poly=p.poly.map(v=>({x:v.x*1.08,y:v.y*.65}));p.cracks++;p.vy-=50}closeMenu()});addButton('Drop fruit',()=>{mode='lab';for(const p of pieces){p.y=H*.16;p.vy=100;p.rest=0}closeMenu()});addButton('Scatter pieces',()=>{mode='lab';for(const p of pieces){p.vx=rand(-250,250);p.vy=rand(-330,-90);p.spin=rand(-4,4);p.rest=0}closeMenu()});addButton('Back to Classic',()=>{mode='classic';spawn();closeMenu()});addButton('← Main menu',home)}
function masteryMenu(){openMenu('Weapon mastery','Every 12 XP² earns another level. Mastery slightly improves cutting force.');for(const k of KNIVES){const xp=save.mastery[k.name]||0;const row=document.createElement('div');row.className='row';row.textContent=k.name+' • Lv '+(1+Math.floor(Math.sqrt(xp/12)))+' • '+xp+' XP';sheet.append(row)}addButton('← Main menu',home)}
function settingsMenu(){openMenu('Settings','Customize your experience and recover from issues.');for(const [key,label] of [['particles','Juice particles'],['reducedMotion','Battery saver / reduced motion'],['sound','Sound effects (reserved for future audio)']])addButton(label+': '+(save.settings[key]?'ON':'OFF'),()=>{save.settings[key]=!save.settings[key];persist();resize();settingsMenu()});addButton('Reset current fruit',()=>{spawn();closeMenu()});addButton('Factory reset this device',()=>{if(confirm('Permanently reset all Cuto Rebirth progress on this device?')){save=fresh();persist();mode='classic';spawn();settingsMenu()}});addButton('← Main menu',home)}
function changelog(){openMenu('Changelog','Current release: '+VERSION);for(const entry of RELEASES){const h=document.createElement('h3');h.textContent='v'+entry.version+' — '+entry.title;sheet.append(h);for(const change of entry.changes){const p=document.createElement('p');p.textContent='• '+change;sheet.append(p)}}addButton('← Main menu',home)}
function ellipse(x,y,rx,ry,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,Math.max(1,rx),Math.max(1,ry),0,0,Math.PI*2);ctx.fill()}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d2745');g.addColorStop(.6,'#12192e');g.addColorStop(1,'#0b1021');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const cx=W/2,py=H*.79,wide=Math.min(W*.8,420),plate=PLATES.find(p=>p.name===save.plate)||PLATES[0];ellipse(cx,py+18,wide*.52,40,'#0008');ellipse(cx,py,wide*.51,50,plate.outer);ellipse(cx,py-5,wide*.46,39,plate.inner);ctx.save();ctx.beginPath();ctx.ellipse(cx,py-5,wide*.45,37,0,0,7);ctx.clip();const shine=ctx.createLinearGradient(cx-wide*.5,py-35,cx+wide*.5,py+35);shine.addColorStop(0,'#ffffff7a');shine.addColorStop(.5,'#ffffff05');shine.addColorStop(1,'#080c2444');ctx.fillStyle=shine;ctx.fillRect(cx-wide*.5,py-42,wide,84);ctx.strokeStyle=plate.pattern===1?'#603e2888':'#ffffff38';ctx.lineWidth=1;for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(cx-wide*.42,py-28+i*7);ctx.lineTo(cx+wide*.42,py-28+i*7);ctx.stroke()}ctx.restore()}
function fruitPaint(p){const f=FRUITS[p.fruit];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.beginPath();p.poly.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.clip();const r=p.r;const base=ctx.createRadialGradient(-r*.35,-r*.4,1,0,0,r*1.2);base.addColorStop(0,'#ffffff');base.addColorStop(.04,p.whole?f.skin:f.flesh);base.addColorStop(.7,p.whole?f.skin:f.flesh);base.addColorStop(1,p.whole?'#25202c':f.core);ctx.fillStyle=base;ctx.fillRect(-r*1.5,-r*1.5,r*3,r*3);
if(p.whole){ctx.globalAlpha=.32;ctx.strokeStyle='#ffffff';ctx.lineWidth=1;for(let i=0;i<12;i++){const x=-r+i*r/5;ctx.beginPath();ctx.moveTo(x,-r);ctx.quadraticCurveTo(x+r*.2,0,x,r);ctx.stroke()}ctx.globalAlpha=1;ellipse(-r*.3,-r*.37,r*.23,r*.11,'#ffffff38')}
else{ctx.strokeStyle=f.core;ctx.lineWidth=Math.max(3,r*.12);ctx.beginPath();ctx.arc(0,0,r*.85,0,Math.PI*2);ctx.stroke();const count=f.seed;for(let i=0;i<count;i++){const angle=i*2.39996,dist=Math.sqrt((i+.5)/count)*r*.65;ellipse(Math.cos(angle)*dist,Math.sin(angle)*dist,2.2,4,'#6c493bba')}}
if(p.cracks){ctx.strokeStyle='#281a2b9c';ctx.lineWidth=2;for(let i=0;i<p.cracks;i++){ctx.beginPath();ctx.moveTo(-r*.2+i*5,-r*.35);ctx.lineTo(i*8-r*.15,r*.12);ctx.lineTo(i*7,r*.35);ctx.stroke()}}
ctx.restore();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.5;ctx.beginPath();p.poly.forEach((v,i)=>i?ctx.lineTo(v.x,v.y):ctx.moveTo(v.x,v.y));ctx.closePath();ctx.stroke();ctx.restore()}
function knifePaint(x,y,angle){const k=KNIVES.find(v=>v.name===save.knife)||KNIVES[0];ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.shadowBlur=10;ctx.shadowColor=k.color;ctx.fillStyle=k.handle;ctx.beginPath();ctx.roundRect(-78,-9,62,18,6);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-70+i*10,-7);ctx.lineTo(-65+i*10,7);ctx.stroke()}ctx.strokeStyle='#d7b57b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(-18,18);ctx.stroke();const g=ctx.createLinearGradient(0,-18,0,18);g.addColorStop(0,'#fff');g.addColorStop(.28,k.color);g.addColorStop(.52,'#46556e');g.addColorStop(.82,k.color);g.addColorStop(1,'#fff');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-18,-11);ctx.lineTo(70+k.style*3,-13);ctx.lineTo(106+k.style*3,0);ctx.lineTo(68+k.style*3,12);ctx.lineTo(-18,11);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffffa8';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function physics(dt,now){const slow=now<slowUntil?.25:1,step=dt*slow,gravity=720,ground=H*.79-25;for(const p of pieces){if(now<freezeUntil)continue;p.vy+=gravity*step;p.x+=p.vx*step;p.y+=p.vy*step;p.angle+=p.spin*step;p.vx*=Math.pow(.993,step*60);p.spin*=Math.pow(.99,step*60);const radius=Math.sqrt(polyArea(p.poly)/Math.PI);if(p.y+radius>ground){p.y=ground-radius;if(Math.abs(p.vy)>18){p.vy*=-.24;p.vx*=.82}else p.vy=0;p.spin*=.65}if(p.x-radius<5){p.x=radius+5;p.vx=Math.abs(p.vx)*.45}if(p.x+radius>W-5){p.x=W-radius-5;p.vx=-Math.abs(p.vx)*.45}}for(let i=0;i<particles.length;i++){const p=particles[i];p.vy+=680*step;p.x+=p.vx*step;p.y+=p.vy*step;p.life-=step;if(p.y>ground){p.y=ground;p.vy*=-.2;p.vx*=.7}}particles=particles.filter(p=>p.life>0&&p.x>-20&&p.x<W+20)}
function render(now){background();for(const p of pieces)fruitPaint(p);if(save.settings.particles)for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ellipse(p.x,p.y,p.r,p.r*.85,p.color)}ctx.globalAlpha=1;if(pointer){for(let i=1;i<trail.length;i++){ctx.strokeStyle=now<fireUntil?'#ff9e56':'#e2f8ff';ctx.lineWidth=3+i/trail.length*5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}knifePaint(pointer.x,pointer.y,pointer.angle||0)}if(now>toastUntil)$('toast').classList.remove('show')}
function frame(now){try{const dt=Math.min(.033,Math.max(0,(now-lastTime)/1000||.016));lastTime=now;physics(dt,now);render(now)}catch(e){report(e);return}requestAnimationFrame(frame)}
function report(e){$('error').textContent='Cuto encountered an error. Reload to recover.\n'+String(e?.stack||e)}
function point(e){const rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top}}
canvas.addEventListener('pointerdown',e=>{if(!modal.hidden)return;canvas.setPointerCapture(e.pointerId);const p=point(e);pointer={...p,id:e.pointerId,angle:0,speed:700,time:performance.now()};trail=[p]});
canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id||!modal.hidden)return;const p=point(e),a={x:pointer.x,y:pointer.y},dt=Math.max(8,performance.now()-pointer.time);pointer.speed=Math.hypot(p.x-a.x,p.y-a.y)*1000/dt;pointer.angle=Math.atan2(p.y-a.y,p.x-a.x);pointer.x=p.x;pointer.y=p.y;pointer.time=performance.now();trail.push(p);if(trail.length>9)trail.shift();trySlice(a,p)});
function release(e){if(pointer&&e.pointerId===pointer.id){pointer=null;trail=[]}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
$('previous').onclick=()=>switchFruit(-1);$('next').onclick=()=>switchFruit(1);$('reset').onclick=spawn;$('power').onclick=applyPower;$('menu').onclick=home;modal.addEventListener('click',e=>{if(e.target===modal)closeMenu()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});window.addEventListener('resize',()=>{resize();spawn()});window.addEventListener('error',e=>report(e.error||e.message));window.addEventListener('unhandledrejection',e=>report(e.reason));
resize();spawn();updateHUD();requestAnimationFrame(frame);home();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
