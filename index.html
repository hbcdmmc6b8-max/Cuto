for(let i=0;i<18;i++){const x=W/2-pw*.5+i*pw/17;ctx.beginPath();if(pattern===0||pattern===3){ctx.moveTo(x,plateY-42);ctx.lineTo(x+(pattern===3?16:0),plateY+38)}else if(pattern===1||pattern===4){ctx.arc(W/2,plateY-5,8+i*5,0,7)}else if(pattern===2){ctx.moveTo(x,plateY-42);ctx.lineTo(x+pw*.15,plateY+38)}else if(pattern===5){ctx.moveTo(x,plateY-5+Math.sin(i*1.8)*22);ctx.lineTo(x+10,plateY-5+Math.cos(i*1.8)*18)}else{ctx.arc(x,plateY-5+Math.sin(i*2)*19,2+(i%3),0,7)}ctx.stroke()}
ctx.restore()}
function drawKnifePattern(){const d=knifeDesign[knifeSkin];if(!d)return;ctx.save();ctx.strokeStyle=hexHue((d.hue+80)%360,90,85);ctx.fillStyle=hexHue((d.hue+40)%360,85,70);ctx.lineWidth=1.5;ctx.globalAlpha=.9;
for(let i=0;i<5;i++){const x=-7+i*13;ctx.beginPath();if(d.pattern===0){ctx.moveTo(x,-8);ctx.lineTo(x+6,5)}else if(d.pattern===1){ctx.moveTo(x,-4);ctx.lineTo(x+4,-7);ctx.lineTo(x+9,2)}else if(d.pattern===2){ctx.arc(x,-2,3,0,7)}else if(d.pattern===3){ctx.moveTo(x,-7);ctx.lineTo(x+10,-7)}else if(d.pattern===4){ctx.moveTo(x,-5);ctx.lineTo(x+4,0);ctx.lineTo(x,-5)}else{ctx.arc(x,0,2+Math.sin(performance.now()/300+i)*1.2,0,7)}ctx.stroke()}
ctx.restore()}

async function cutoAuth(){if(!navigator.onLine)throw Error('Offline');if(cutoSession?.access_token&&Date.now()<(cutoSession.expires_at||0)-60000)return cutoSession;
const headers={'apikey':supabasePublicKey,'Content-Type':'application/json'};
let response;
if(cutoSession?.refresh_token){response=await fetch(supabaseURL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers,body:JSON.stringify({refresh_token:cutoSession.refresh_token})});}
if(!response?.ok){response=await fetch(supabaseURL+'/auth/v1/signup',{method:'POST',headers,body:JSON.stringify({data:{cuto_player:true}})});}
if(!response.ok)throw Error('Sign-in failed ('+response.status+'). Check Anonymous Sign-Ins.');
const data=await response.json();if(!data.access_token||!data.user?.id)throw Error('No anonymous session returned');
cutoSession={access_token:data.access_token,refresh_token:data.refresh_token,user_id:data.user.id,expires_at:Date.now()+(Number(data.expires_in)||3600)*1000};
try{localStorage.setItem(cutoAuthKey,JSON.stringify(cutoSession))}catch(e){}
return cutoSession}

const cutoMaterialCache=new Map();
function cutoMaterial(name,type){
const key=type+':'+name;if(cutoMaterialCache.has(key))return cutoMaterialCache.get(key);
const el=document.createElement('canvas');el.width=256;el.height=256;const g=el.getContext('2d');
let seed=0;for(let i=0;i<key.length;i++)seed=(seed*31+key.charCodeAt(i))>>>0;
const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
const palette=type==='plate'?(plateSkins[name]||['#777','#bbb']):[knifeSkins[name]||'#ddd','#7b6d8d'];
g.fillStyle=palette[1]||palette[0];g.fillRect(0,0,256,256);
const wood=/Wood|Maple|Oak|Bamboo|Copper|Bronze|Training|Mallet|Club/i.test(name);
const stone=/Marble|Granite|Stone|Quartz|Obsidian|Onyx|Crystal|Void|Meteor/i.test(name);
if(wood){for(let i=0;i<75;i++){const y=rnd()*256;g.strokeStyle=i%3?'#ffffff22':'#301c2d33';g.lineWidth=.4+rnd()*3;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(65,y+rand(-12,12),160,y+rand(-15,15),256,y+rand(-7,7));g.stroke()}}
else if(stone){for(let i=0;i<38;i++){g.strokeStyle=i%3?'#ffffff30':'#13102033';g.lineWidth=.6+rnd()*2;let x=rnd()*256,y=rnd()*256;g.beginPath();g.moveTo(x,y);for(let j=0;j<4;j++){x+=rnd()*65-30;y+=rnd()*65-30;g.lineTo(x,y)}g.stroke()}}
else{for(let i=0;i<60;i++){const y=rnd()*256;g.strokeStyle=i%2?'#ffffff16':'#00000016';g.lineWidth=1+rnd()*2;g.beginPath();g.moveTo(0,y);g.lineTo(256,y+rnd()*12-6);g.stroke()}}
for(let i=0;i<900;i++){const x=rnd()*256,y=rnd()*256;g.fillStyle=rnd()>.5?'#ffffff16':'#00000013';g.fillRect(x,y,1+rnd()*2,1+rnd()*2)}
const sheen=g.createLinearGradient(0,0,256,256);sheen.addColorStop(0,'#ffffff30');sheen.addColorStop(.4,'#ffffff03');sheen.addColorStop(1,'#00000030');g.fillStyle=sheen;g.fillRect(0,0,256,256);cutoMaterialCache.set(key,el);return el}
function cutoDrawMaterial(ctx2,name,type,x,y,w,h){ctx2.save();ctx2.globalAlpha=save.performanceMode?.35:.72;ctx2.drawImage(cutoMaterial(name,type),x,y,w,h);ctx2.restore()}

function cutoBladePath(c,form){
c.beginPath();
switch(form){
case 0:c.moveTo(-18,-7);c.quadraticCurveTo(45,-12,102,-22);c.quadraticCurveTo(85,-6,42,3);c.lineTo(-18,7);break;
case 1:c.moveTo(-18,-13);c.lineTo(30,-13);c.lineTo(100,0);c.lineTo(30,13);c.lineTo(-18,13);break;
case 2:c.moveTo(-18,-14);c.lineTo(79,-18);c.lineTo(79,28);c.lineTo(-18,22);break;
case 3:c.moveTo(-18,-9);c.quadraticCurveTo(60,-22,100,-29);c.quadraticCurveTo(79,-2,30,8);c.lineTo(-18,8);break;
case 4:c.moveTo(-18,-12);c.quadraticCurveTo(18,-12,40,10);c.quadraticCurveTo(72,27,103,-6);c.quadraticCurveTo(72,41,32,25);c.lineTo(-18,8);break;
case 5:c.moveTo(-18,-13);c.lineTo(51,-13);c.lineTo(51,-4);c.lineTo(99,0);c.lineTo(51,13);c.lineTo(-18,13);break;
case 6:c.moveTo(-18,-10);c.quadraticCurveTo(45,-24,84,-45);c.quadraticCurveTo(115,-48,114,-33);c.quadraticCurveTo(57,3,-18,11);break;
case 7:c.moveTo(-18,-16);c.lineTo(48,-16);c.quadraticCurveTo(92,-14,108,-29);c.quadraticCurveTo(100,-5,75,12);c.lineTo(-18,17);break;
case 8:c.moveTo(-18,-6);c.quadraticCurveTo(31,-63,75,-25);c.quadraticCurveTo(90,10,35,38);c.quadraticCurveTo(61,8,46,-12);c.quadraticCurveTo(26,-31,-18,8);break;
case 9:c.moveTo(-18,-4);c.lineTo(133,-5);c.lineTo(160,0);c.lineTo(133,5);c.lineTo(-18,4);break;
case 10:c.moveTo(-18,-18);c.lineTo(94,-18);c.quadraticCurveTo(111,-11,116,0);c.lineTo(94,19);c.lineTo(-18,18);break;
case 11:c.moveTo(-18,-10);for(let j=0;j<7;j++)c.lineTo(j*18-10,(j%2?15:-15));c.lineTo(118,0);for(let j=6;j>=0;j--)c.lineTo(j*18-10,(j%2?-15:15));break;
case 12:c.moveTo(-18,-14);c.lineTo(81,-20);c.lineTo(116,-8);c.lineTo(105,10);c.lineTo(-18,15);break;
case 13:c.moveTo(-18,-8);c.lineTo(95,-9);c.lineTo(111,0);c.lineTo(95,9);c.lineTo(-18,8);break;
case 14:c.moveTo(-18,-12);c.lineTo(65,-16);c.quadraticCurveTo(116,-27,117,-55);c.quadraticCurveTo(129,-7,67,10);c.lineTo(-18,12);break;
default:c.moveTo(-18,-17);c.lineTo(72,-17);c.lineTo(96,0);c.lineTo(72,17);c.lineTo(-18,17);
}
c.closePath()}
function cutoRenderSharp(c,name,x,y,angle,scale){
const d=knifeDesign[name],form=d?.form??(name==='Katana'?0:name==='Chef Knife'?2:1),hue=d?.hue||200;
const k=knifeProfiles[name]||{handle:hexHue(hue,40,24),guard:hexHue(hue,65,60),blade:hexHue(hue,25,86)};
c.save();c.translate(x,y);c.rotate(angle);c.scale(scale,scale);
c.shadowColor=knifeSkins[name]||'#ffffff';c.shadowBlur=7;
c.lineCap='round';
c.fillStyle=k.handle;c.beginPath();
if(form===8){c.ellipse(-48,2,27,17,-.3,0,7);c.moveTo(-45,-4);c.arc(-48,2,8,0,7,true)}
else if(form===13){c.roundRect(-80,-10,61,20,5)}
else if(form===9){c.roundRect(-90,-7,71,14,4)}
else c.roundRect(-80,-10,62,20,form===0?3:7);
c.fill('evenodd');
c.strokeStyle='#ffffff55';c.lineWidth=2;for(let i=0;i<5;i++){c.beginPath();c.moveTo(-73+i*10,-8);c.lineTo(-68+i*10,8);c.stroke()}
c.shadowBlur=0;
c.strokeStyle=k.guard;c.lineWidth=form===9?3:6;c.beginPath();c.moveTo(-20,-19);c.lineTo(-20,19);c.stroke();
if(form===13){c.strokeStyle=k.guard;c.lineWidth=4;c.beginPath();c.moveTo(-77,-11);c.lineTo(-77,11);c.stroke()}
cutoBladePath(c,form);c.save();c.clip();c.fillStyle=k.blade;c.fill();cutoDrawMaterial(c,name,'weapon',-25,-60,190,120);cutoPremiumBladeFinish(c,name,form);
const shine=c.createLinearGradient(0,-50,0,50);shine.addColorStop(0,'#ffffffaa');shine.addColorStop(.38,'#ffffff10');shine.addColorStop(.55,'#10101b60');shine.addColorStop(.85,'#ffffff80');shine.addColorStop(1,'#11122260');c.fillStyle=shine;c.fillRect(-25,-60,200,120);c.restore();
c.strokeStyle=knifeSkins[name]||'#ddd';c.lineWidth=1.6;cutoBladePath(c,form);c.stroke();
c.strokeStyle='#ffffff80';c.lineWidth=1;c.beginPath();c.moveTo(-12,0);c.lineTo(form===9?142:form===8?45:78,0);c.stroke();
c.restore()}

function addCutEffects(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;for(let i=0;i<(save.performanceMode?7:25);i++){const t=Math.random(),side=Math.random()<.5?-1:1;effects.push({x:a.x+dx*t,y:a.y+dy*t,vx:nx*side*rand(35,150)+rand(-25,25),vy:ny*side*rand(35,150)+rand(-35,35),life:rand(.16,.43),max:.43,r:rand(1.2,3.5)})}if(effects.length>160)effects.splice(0,effects.length-160)}
function drawKnifeEffects(){ctx.save();ctx.globalCompositeOperation='lighter';for(const e of effects){ctx.globalAlpha=clamp(e.life/e.max,0,1)*.85;ctx.fillStyle=({Sparks:'#ffd65b',Confetti:['#fc6a85','#73dff3','#ffd65b'][Math.floor(e.x)%3],Hearts:'#ff6c9c',Glitter:'#ffffff'})[save.equippedEffect]||knifeSkins[knifeSkin];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()}ctx.restore()}

function render(){drawBackground();ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoomLevel,zoomLevel);ctx.translate(-W/2,-H/2);drawV8Extras();for(const p of pieces)drawPiece(p);cutoJuiceDraw();for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=fruits[fruitIndex].flesh;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;drawKnifeEffects();
if(pointer){const a=pointer.start,b=pointer.end,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);ctx.save();ctx.lineCap='round';ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=13;ctx.strokeStyle=({Lightning:'#f8df65',Stars:'#fff5ad',Petals:'#ff93bd',Fire:'#ff7a3c',Frost:'#a3e9ff'})[save.equippedTrail]||knifeSkins[knifeSkin];ctx.globalAlpha=.32;ctx.lineWidth=(12+Math.min(7,cutoWeaponLevel(knifeSkin)))*lineSize;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=.9;ctx.lineWidth=2.5*lineSize;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();drawKnife(b.x,b.y,Math.atan2(dy,dx)||0,.9*knifeSize)}
else if(trail.length>1){ctx.save();ctx.lineCap='round';for(let i=1;i<trail.length;i++){ctx.strokeStyle=({Lightning:'#f8df65',Stars:'#fff5ad',Petals:'#ff93bd',Fire:'#ff7a3c',Frost:'#a3e9ff'})[save.equippedTrail]||knifeSkins[knifeSkin];ctx.globalAlpha=clamp(trail[i].life/.23,0,1)*.8;ctx.lineWidth=7*lineSize;ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}ctx.restore()}ctx.restore()}

function cutoFruitMass(p){return Math.max(.4,Math.min(5,area(p.poly)/16000))*(p.whole?1.15:.85)}
function cutoFruitExtent(p){const c=Math.cos(p.angle),s=Math.sin(p.angle);let bottom=-Infinity,left=Infinity,right=-Infinity;for(const v of p.poly){const x=v.x*c-v.y*s,y=v.x*s+v.y*c;if(y>bottom)bottom=y;if(x<left)left=x;if(x>right)right=x}return {bottom,left,right}}
function cutoFruitRadius(p){return Math.max(9,Math.sqrt(Math.max(1,area(p.poly))/Math.PI))}
function cutoIntegrateFruit(p,dt){
updateFruitSoftBody(p,dt);
if(p.frostTimer>0){p.frostTimer-=dt;p.vx*=Math.exp(-5*dt);p.vy*=Math.exp(-3*dt)}
if(p.burnTimer>0){p.burnTimer-=dt;p.wobble=Math.max(p.wobble||0,.04);if(Math.random()<dt*15)effects.push({x:p.x+rand(-25,25),y:p.y+rand(-25,25),vx:rand(-30,30),vy:-90,life:.35,max:.35,r:3})}
if(p.phantomTimer>0)p.phantomTimer-=dt;
if(p.precisionGlow>0)p.precisionGlow=Math.max(0,p.precisionGlow-dt);
const mass=cutoFruitMass(p),gravity=850,resting=p.resting&&Math.abs(p.vy)<7;
if(!resting)p.vy+=gravity*dt;
p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;
const air=Math.exp(-(.22+.12/mass)*dt);p.vx*=air;p.spin*=Math.exp(-(.35+.15/mass)*dt);
const floor=plateY-25,ext=cutoFruitExtent(p);
if(p.y+ext.bottom>=floor){
const impact=Math.max(0,p.vy);
p.y=floor-ext.bottom;
const bounce=impact>105?Math.min(.32,.12+.045/mass):0;
p.vy=-impact*bounce;
p.vx*=Math.exp(-(impact>105?1.5:7)*dt);
p.spin*=Math.exp(-(impact>105?2.5:9)*dt);
if(impact>45){p.wobble=Math.min(.19,.03+impact/1800);if(p.whole){const soft=cutoSoftBody(p);if(soft)for(let i=0;i<soft.length;i++){const v=p.poly[i];if(v.y>0)soft[i].vy-=Math.min(140,impact*.28)*(v.y/Math.max(1,ext.bottom))}}}
if(Math.abs(p.vy)<8)p.vy=0;
if(Math.abs(p.vx)<3)p.vx=0;
if(Math.abs(p.spin)<.035)p.spin=0;
p.resting=p.vy===0;
}else p.resting=false;
const left=15-ext.left,right=W-15-ext.right;
if(p.x<left){p.x=left;p.vx=Math.abs(p.vx)*.28;p.spin*=.7}
if(p.x>right){p.x=right;p.vx=-Math.abs(p.vx)*.28;p.spin*=.7}
if(p.wobble)p.wobble=Math.max(0,p.wobble-dt*.7);
}
function cutoResolveFruitCollisions(){
if(save.performanceMode)return;
for(let i=0;i<pieces.length;i++)for(let j=i+1;j<pieces.length;j++){
const a=pieces[i],b=pieces[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001;
const ra=cutoFruitRadius(a)*.85,rb=cutoFruitRadius(b)*.85,overlap=ra+rb-dist;
if(overlap<=0)continue;
const nx=dx/dist,ny=dy/dist,ma=cutoFruitMass(a),mb=cutoFruitMass(b),invA=1/ma,invB=1/mb,sum=invA+invB;
const correction=Math.min(overlap,Math.min(ra,rb)*.5)*.8;
a.x-=nx*correction*invA/sum;a.y-=ny*correction*invA/sum;
b.x+=nx*correction*invB/sum;b.y+=ny*correction*invB/sum;
const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
if(relative<-.5){const impulse=-(1+.18)*relative/sum;a.vx-=impulse*nx*invA;a.vy-=impulse*ny*invA;b.vx+=impulse*nx*invB;b.vy+=impulse*ny*invB;
a.spin-=impulse*.0008;b.spin+=impulse*.0008;a.resting=false;b.resting=false;
if(a.whole)cutoSoftBody(a);if(b.whole)cutoSoftBody(b);
}
}}
function update(dt){
if(slowTimer>0){slowTimer-=dt;dt*=.3}if(cutoGravityTimer>0){cutoGravityTimer-=dt;for(const p of pieces){p.vx+=(W/2-p.x)*dt*2.5;p.vy-=(p.y-H*.36)*dt*2;p.resting=false}}if(cutoMagnetTimer>0){cutoMagnetTimer-=dt;for(const p of pieces){p.vx+=(W/2-p.x)*dt*4;p.resting=false}}if(cutoFireTimer>0){cutoFireTimer-=dt;for(const p of pieces){p.burnTimer=Math.max(p.burnTimer||0,.2);if(Math.random()<dt*8)effects.push({x:p.x+rand(-18,18),y:p.y+rand(-18,18),vx:rand(-45,45),vy:-70,life:.5,max:.5,r:3})}}
cutoJuiceUpdate(dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.querySelector('#toast').textContent=''}
for(const stain of stains)stain.life-=dt;stains=stains.filter(s=>s.life>0);
const steps=Math.max(1,Math.ceil(dt/.016)),step=dt/steps;
for(let k=0;k<steps;k++){for(const p of pieces)cutoIntegrateFruit(p,step);cutoResolveFruitCollisions()}
for(const p of particles){p.life-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
particles=particles.filter(p=>p.life>0);trail=trail.filter(p=>(p.life-=dt)>0);
for(const e of effects){e.life-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=180*dt}
effects=effects.filter(e=>e.life>0);
}

function point(e){const rect=canvas.getBoundingClientRect();const x=(e.clientX-rect.left)*(W/Math.max(1,rect.width)),y=(e.clientY-rect.top)*(H/Math.max(1,rect.height));return {x:(x-W/2)/zoomLevel+W/2,y:(y-H/2)/zoomLevel+H/2}}
canvas.addEventListener('pointerdown',e=>{if(pointer)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);const start=point(e);audio();pointer={id:e.pointerId,start,end:{...start}}});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();pointer.end=point(e)});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();const start=pointer.start,end=point(e);pointer=null;const distance=Math.hypot(end.x-start.x,end.y-start.y);if(distance>=12){if(power==='Multi-Cut'&&save.ownedPowers.includes(power)&&multiLines.length<2){multiLines.push([start,end]);announce('Multi-Cut: '+multiLines.length+'/3 lines');return}if(multiLines.length){for(const [a,b] of multiLines)v8Cut(a,b);multiLines=[]}const didCut=v8Cut(start,end);playWhoosh();if(didCut){playSlice();addCutEffects(start,end)}trail=[{...start,life:.23},{...end,life:.23}]}});
canvas.addEventListener('pointercancel',e=>{if(pointer?.id===e.pointerId)pointer=null});
