<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');

const knifeSkins={Classic:'#fff5dc','Azure Rift':'#44e6ff','Solar Edge':'#ffd66c','Rose Quartz':'#ff7fb7','Emerald':'#66ffab','Crimson':'#ff6475'};const plateSkins={Ceramic:['#cbb6c6','#f6e9e1'],Marble:['#353139','#55505b'],Sakura:['#d9a6bb','#ffe3ee'],Ocean:['#33758f','#72d9ef'],Gold:['#b88c41','#f6d991'],Obsidian:['#493947','#201b2b']};let knifeSkin='Classic',plateSkin='Ceramic';try{knifeSkin=localStorage.getItem('cuto-knife')||'Classic';plateSkin=localStorage.getItem('cuto-plate')||'Ceramic'}catch(e){}if(!knifeSkins[knifeSkin])knifeSkin='Classic';if(!plateSkins[plateSkin])plateSkin='Ceramic';
const backgrounds={midnight:['#211b36','#47314a'],sunset:['#6c365e','#e7a176'],ocean:['#123b59','#3b93a3'],forest:['#203d38','#72966c'],cream:['#bca48e','#f0d6b4'],cherry:['#48223c','#ad5773']};let background='midnight';try{const saved=localStorage.getItem('cuto-background');if(Object.prototype.hasOwnProperty.call(backgrounds,saved))background=saved}catch(e){}
const fruitNames=["Apple","Green Apple","Golden Apple","Crabapple","Pear","Asian Pear","Quince","Peach","Nectarine","Apricot","Plum","Damson","Cherry","Sour Cherry","Mango","Papaya","Guava","Feijoa","Passion Fruit","Granadilla","Dragon Fruit","Yellow Dragon Fruit","Kiwi","Golden Kiwi","Strawberry","Raspberry","Blackberry","Blueberry","Cranberry","Gooseberry","Blackcurrant","Redcurrant","Whitecurrant","Boysenberry","Loganberry","Mulberry","Cloudberry","Huckleberry","Elderberry","Salmonberry","Orange","Blood Orange","Mandarin","Tangerine","Clementine","Satsuma","Kumquat","Calamansi","Grapefruit","Pomelo","Lemon","Meyer Lemon","Lime","Key Lime","Finger Lime","Yuzu","Sudachi","Citron","Bergamot","Ugli Fruit","Watermelon","Yellow Watermelon","Cantaloupe","Honeydew","Galia Melon","Canary Melon","Santa Claus Melon","Casaba Melon","Korean Melon","Bitter Melon","Pineapple","Pink Pineapple","Banana","Red Banana","Plantain","Coconut","Date","Fig","Pomegranate","Persimmon","Fuyu Persimmon","Starfruit","Star Apple","Jackfruit","Breadfruit","Durian","Rambutan","Lychee","Longan","Mangosteen","Salak","Langsat","Duku","Santol","Soursop","Sugar Apple","Cherimoya","Atemoya","Sapodilla","Mamey Sapote","Black Sapote","White Sapote","Canistel","Jabuticaba","Acerola","Surinam Cherry","Miracle Fruit","Ackee","Bael","Wood Apple","Medlar","Loquat","Tamarind","Carambola","Prickly Pear","Naranjilla","Pepino Melon","Cape Gooseberry","Ground Cherry","Tamarillo","Lucuma","Cupuacu","Cacao Fruit","Monstera Fruit","Marula","Bilberry","Lingonberry","Sea Buckthorn","Aronia","Serviceberry","Jujube","Olive","Avocado","Breadnut","Rose Apple","Wax Apple","Malay Apple","Mountain Apple","Ambarella","Hog Plum","June Plum","Kiwano","Horned Melon","African Cucumber","Buddha's Hand","Makrut Lime","Sweet Lime","Sweet Lemon","Dekopon","Navel Orange","Valencia Orange","Seville Orange","Cara Cara Orange","Black Cherry","Rainier Cherry","Concord Grape","Green Grape","Red Grape","Black Grape","Muscat Grape","Cotton Candy Grape","Champagne Grape","White Peach","Donut Peach","Flat Nectarine","Greengage","Mirabelle Plum","Black Mission Fig","Calimyrna Fig","Hachiya Persimmon","Ataulfo Mango","Alphonso Mango","Kent Mango","Keitt Mango","Kesar Mango","Tommy Atkins Mango","Honeycrisp Apple","Granny Smith Apple","Fuji Apple","Gala Apple","Pink Lady Apple","Braeburn Apple","Red Delicious Apple","Golden Delicious Apple","Bosc Pear","Anjou Pear","Bartlett Pear","Comice Pear","Forelle Pear","Seckel Pear"];
const baseFruits=[
{name:'Orange',skin:'#f28a20',flesh:'#ffb52d',core:'#fff0aa',seed:'#fff2c8',radius:104},
{name:'Watermelon',skin:'#258b55',flesh:'#f04e65',core:'#f87683',seed:'#40282c',radius:114},
{name:'Kiwi',skin:'#93723b',flesh:'#9bd44b',core:'#e7f7b2',seed:'#282b20',radius:102},
{name:'Lemon',skin:'#e8c62e',flesh:'#f5e477',core:'#fff6bc',seed:'#f5eac8',radius:101},
{name:'Apple',skin:'#e44a53',flesh:'#f5e9b2',core:'#f3d78c',seed:'#75472f',radius:107},
{name:'Lime',skin:'#60aa39',flesh:'#a9d957',core:'#e7f4a6',seed:'#fff6c4',radius:100},
{name:'Berry',skin:'#8c345d',flesh:'#e3688b',core:'#e9a3b2',seed:'#f9dbb5',radius:88},
{name:'Grape',skin:'#683e91',flesh:'#b5a2d7',core:'#e2ccef',seed:'#70517b',radius:95},
{name:'Peach',skin:'#e9945b',flesh:'#ffcf9c',core:'#fbe6bc',seed:'#884e31',radius:106},
{name:'Melon',skin:'#9cb65c',flesh:'#f6d49d',core:'#f9e9c8',seed:'#c39b65',radius:110},
{name:'Dragon',skin:'#e84e91',flesh:'#f7f1e9',core:'#ffffff',seed:'#2e2632',radius:107},
{name:'Tropical',skin:'#b7a33e',flesh:'#f6c95a',core:'#fff2ae',seed:'#705331',radius:109}
];
function family(name){const n=name.toLowerCase();if(/orange|mandarin|tangerine|clementine|satsuma|kumquat|calamansi|grapefruit|pomelo|yuzu|sudachi|citron|bergamot|ugli|dekopon/.test(n))return 0;if(/watermelon/.test(n))return 1;if(/kiwi/.test(n))return 2;if(/lemon|lime|buddha/.test(n))return 3;if(/apple|pear|quince/.test(n))return 4;if(/berry|currant|cherry|grape|mulberry|lingon|bilberry|aronia/.test(n))return 6;if(/peach|plum|apricot|nectarine|mango/.test(n))return 8;if(/melon|cucumber|kiwano/.test(n))return 9;if(/dragon|pitaya/.test(n))return 10;return 11}
const fruits=fruitNames.map((name,i)=>{const f={...baseFruits[family(name)],name};if(/green apple|granny smith/.test(name.toLowerCase()))f.skin='#70ad40';if(/golden apple|golden delicious/.test(name.toLowerCase()))f.skin='#e5be4c';if(/blood orange/.test(name.toLowerCase()))f.flesh='#be3455';if(/yellow watermelon/.test(name.toLowerCase()))f.flesh='#f4d64f';if(/blueberry|bilberry/.test(name.toLowerCase()))f.skin='#394d98';if(/coconut/.test(name.toLowerCase())){f.skin='#79563b';f.flesh='#fff9e9'}if(/avocado/.test(name.toLowerCase())){f.skin='#3d653c';f.flesh='#b8d98b'}return f});
let fruitHistory=[];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);plateY=H*.69;if(pieces.length===0)spawn(false)}
addEventListener('resize',resize);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function circlePoly(r,n=64){return Array.from({length:n},(_,i)=>{const a=i*2*Math.PI/n;return {x:Math.cos(a)*r,y:Math.sin(a)*r}})}
function area(poly){let s=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s)/2}
function centroid(poly){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return {x:x/poly.length,y:y/poly.length}}
function bounds(poly){let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;for(const p of poly){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}return {x0,x1,y0,y1}}
function makeTexture(f){const c=document.createElement('canvas');c.width=c.height=320;const g=c.getContext('2d'),cx=160,cy=160,r=144;g.clearRect(0,0,c.width,c.height);g.beginPath();g.arc(cx,cy,r,0,7);g.fillStyle=f.skin;g.fill();g.beginPath();g.arc(cx,cy,r-9,0,7);g.fillStyle=f.core;g.fill();g.beginPath();g.arc(cx,cy,r-17,0,7);g.fillStyle=f.flesh;g.fill();
const grad=g.createRadialGradient(108,98,12,160,160,150);grad.addColorStop(0,'#ffffff66');grad.addColorStop(1,'#0000003d');g.fillStyle=grad;g.beginPath();g.arc(cx,cy,r-17,0,7);g.fill();
if(['Orange','Lemon','Lime'].includes(f.name)){for(let i=0;i<10;i++){const a=i*Math.PI/5;g.strokeStyle='#fff8d0a8';g.lineWidth=3;g.beginPath();g.moveTo(cx+Math.cos(a)*12,cy+Math.sin(a)*12);g.lineTo(cx+Math.cos(a)*(r-18),cy+Math.sin(a)*(r-18));g.stroke()}g.fillStyle=f.core;g.beginPath();g.arc(cx,cy,12,0,7);g.fill()}
else if(f.name==='Kiwi'){g.fillStyle=f.core;g.beginPath();g.ellipse(cx,cy,36,43,0,0,7);g.fill();for(let i=0;i<30;i++){const a=i*2*Math.PI/30;g.fillStyle=f.seed;g.beginPath();g.ellipse(cx+Math.cos(a)*54,cy+Math.sin(a)*54,2.5,5,a,0,7);g.fill()}}

for(let i=0;i<240;i++){const x=rand(-r,r),y=rand(-r,r);if(x*x+y*y>(r-20)**2)continue;g.fillStyle=i%3?'#ffffff18':'#6d30250c';g.beginPath();g.arc(cx+x,cy+y,rand(.5,2),0,7);g.fill()}return c}
const textures=[];function getTexture(i){if(!textures[i])textures[i]=makeTexture(fruits[i]);return textures[i]}
function spawn(advance=true){pointer=null;effects=[];if(advance){fruitHistory.push(fruitIndex);fruitIndex=Math.floor(Math.random()*fruits.length);if(fruits.length>1&&fruitIndex===fruitHistory[fruitHistory.length-1])fruitIndex=(fruitIndex+1)%fruits.length;}pieces=[];particles=[];trail=[];const r=Math.min(fruits[fruitIndex].radius,W*.30,H*.20);document.querySelector('#fruitName').textContent=fruits[fruitIndex].name+' · '+fruits.length+' fruits';pieces.push({poly:circlePoly(r),x:W/2,y:H*.44,vx:0,vy:0,angle:0,spin:0,scale:r/144,depth:0,whole:true});}
function clip(poly,a,b,side){const out=[];const cross=p=>(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x);for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],dp=cross(p)*side,dq=cross(q)*side;if(dp>=-1e-7)out.push({...p});if((dp<0&&dq>0)||(dp>0&&dq<0)){const t=dp/(dp-dq);out.push({x:p.x+(q.x-p.x)*t,y:p.y+(q.y-p.y)*t})}}return out}
function local(p,body){const dx=p.x-body.x,dy=p.y-body.y,c=Math.cos(-body.angle),s=Math.sin(-body.angle);return {x:dx*c-dy*s,y:dx*s+dy*c}}

hits++;for(let i=0;i<13;i++)particles.push({x:(a.x+b.x)/2+rand(-20,20),y:(a.y+b.y)/2+rand(-20,20),vx:rand(-130,130),vy:rand(-220,-30),life:rand(.3,.75),size:rand(2,6)})}
pieces=next;if(hits&&navigator.vibrate)navigator.vibrate(12)}
function path(poly){ctx.beginPath();ctx.moveTo(poly[0].x,poly[0].y);for(let i=1;i<poly.length;i++)ctx.lineTo(poly[i].x,poly[i].y);ctx.closePath()}
function drawPiece(p){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);path(p.poly);ctx.save();ctx.clip();const f=fruits[fruitIndex],r=f.radius,off=p.texOffset||{x:0,y:0};if(p.whole){const skin=ctx.createRadialGradient(-r*.38,-r*.42,2,0,0,r*1.1);skin.addColorStop(0,'#ffffff55');skin.addColorStop(.3,f.skin);skin.addColorStop(1,'#25141b');ctx.fillStyle=skin;ctx.fillRect(-r-off.x,-r-off.y,2*r,2*r);ctx.fillStyle='#ffffff21';for(let i=0;i<75;i++){const xx=Math.sin(i*19.37)*r*.78,yy=Math.cos(i*12.47)*r*.78;ctx.fillRect(xx-1,yy-1,2,2)}}else{const tex=getTexture(fruitIndex);ctx.drawImage(tex,-r-off.x,-r-off.y,2*r,2*r)}ctx.restore();ctx.strokeStyle='#fff5d470';ctx.lineWidth=1.7;path(p.poly);ctx.stroke();ctx.restore()}
function drawBackground(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,backgrounds[background][0]);bg.addColorStop(1,backgrounds[background][1]);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff09';for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(W*(i%4+.5)/4,H*(Math.floor(i/4)+.4)/3,30+i*7,0,7);ctx.fill()}const pw=Math.min(W*.84,410);ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(W/2,plateY+19,pw*.50,42,0,0,7);ctx.fill();ctx.fillStyle=plateSkins[plateSkin][0];ctx.beginPath();ctx.ellipse(W/2,plateY,pw*.50,48,0,0,7);ctx.fill();ctx.fillStyle=plateSkins[plateSkin][1];ctx.beginPath();ctx.ellipse(W/2,plateY-5,pw*.45,37,0,0,7);ctx.fill();ctx.strokeStyle='#d8c6d0';ctx.lineWidth=4;ctx.stroke()}

/* Cuto v6: procedural knife art and synthesized sound (no external assets). */
let audioCtx=null, soundEnabled=true, effects=[];
try{soundEnabled=localStorage.getItem('cuto-sound')!=='off'}catch(e){}
function audio(){if(!soundEnabled)return null;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,duration,kind='sine',volume=.06,slide=1){const ac=audio();if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=kind;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*slide),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02)}
function noise(duration=.18,volume=.10,filterFreq=1800){const ac=audio();if(!ac)return;const n=Math.ceil(ac.sampleRate*duration),buffer=ac.createBuffer(1,n,ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();filter.type='bandpass';filter.frequency.value=filterFreq;filter.Q.value=.65;gain.gain.value=volume;src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(ac.destination);src.start()}
function playSlice(){noise(.23,.19,1100);tone(330,.16,'triangle',.055,.48);tone(850,.10,'sine',.018,.52)}
function playWhoosh(){noise(.10,.045,3100)}
const knifeProfiles={

'Azure Rift':{handle:'#16283e',guard:'#32b9d7',blade:'#b8f9ff',style:1},
'Solar Edge':{handle:'#654024',guard:'#f8b945',blade:'#fff3a8',style:2},
'Rose Quartz':{handle:'#65354f',guard:'#ff8fb9',blade:'#ffe1ee',style:3},

Crimson:{handle:'#391c2a',guard:'#ed4c6a',blade:'#ffe1e3',style:5}
};
function drawKnife(x,y,angle,scale=1){const k=knifeProfiles[knifeSkin]||knifeProfiles.Classic;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=k.style?17:5;

ctx.strokeStyle=k.guard;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-23,-12);ctx.lineTo(-23,12);ctx.stroke();
ctx.fillStyle=k.blade;ctx.beginPath();ctx.moveTo(-19,-10);ctx.lineTo(43,-9);ctx.quadraticCurveTo(60,-9,73,0);ctx.lineTo(42,7);ctx.lineTo(-19,7);ctx.closePath();ctx.fill();
const g=ctx.createLinearGradient(0,-10,0,9);g.addColorStop(0,'#ffffffcc');g.addColorStop(.48,'#ffffff08');g.addColorStop(1,knifeSkins[knifeSkin]);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-16,-9);ctx.lineTo(43,-8);ctx.lineTo(71,0);ctx.lineTo(-16,1);ctx.closePath();ctx.fill();
ctx.strokeStyle=knifeSkins[knifeSkin];ctx.lineWidth=k.style?2.2:1;ctx.beginPath();ctx.moveTo(-15,7);ctx.lineTo(43,7);ctx.lineTo(71,0);ctx.stroke();
ctx.fillStyle=k.guard;ctx.beginPath();ctx.arc(-48,0,2.2,0,7);ctx.arc(-33,0,2.2,0,7);ctx.fill();
if(k.style){ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=11;ctx.strokeStyle=knifeSkins[knifeSkin];ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(3,-4);ctx.lineTo(24,-4);ctx.lineTo(31,0);ctx.stroke()}ctx.restore()}
function addCutEffects(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;for(let i=0;i<25;i++){const t=Math.random(),side=Math.random()<.5?-1:1;effects.push({x:a.x+dx*t,y:a.y+dy*t,vx:nx*side*rand(35,150)+rand(-25,25),vy:ny*side*rand(35,150)+rand(-35,35),life:rand(.16,.43),max:.43,r:rand(1.2,3.5)})}if(effects.length>160)effects.splice(0,effects.length-160)}
function drawKnifeEffects(){ctx.save();ctx.globalCompositeOperation='lighter';for(const e of effects){ctx.globalAlpha=clamp(e.life/e.max,0,1)*.85;ctx.fillStyle=knifeSkins[knifeSkin];ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=9;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()}ctx.restore()}

function render(){drawBackground();for(const p of pieces)drawPiece(p);for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=fruits[fruitIndex].flesh;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;drawKnifeEffects();
if(pointer){const a=pointer.start,b=pointer.end,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);ctx.save();ctx.lineCap='round';ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=13;ctx.strokeStyle=knifeSkins[knifeSkin];ctx.globalAlpha=.32;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=.9;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();drawKnife(b.x,b.y,Math.atan2(dy,dx)||0,.9)}
else if(trail.length>1){ctx.save();ctx.lineCap='round';for(let i=1;i<trail.length;i++){ctx.strokeStyle=knifeSkins[knifeSkin];ctx.globalAlpha=clamp(trail[i].life/.23,0,1)*.8;ctx.lineWidth=7;ctx.shadowColor=knifeSkins[knifeSkin];ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}ctx.restore()}}

function update(dt){for(const p of pieces){p.vy+=850*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;p.vx*=Math.exp(-1.3*dt);p.spin*=Math.exp(-1.4*dt);const maxR=Math.max(...p.poly.map(v=>Math.hypot(v.x,v.y)));const floor=plateY-25;if(p.y+maxR*.50>floor&&p.vy>0){p.y=floor-maxR*.50;p.vy*=-.23;p.vx*=.78;p.spin*=.65}p.x=clamp(p.x,20,W-20)}for(const p of particles){p.life-=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);trail=trail.filter(p=>(p.life-=dt)>0);for(const e of effects){e.life-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=180*dt}effects=effects.filter(e=>e.life>0)}
function frame(t){try{const dt=Math.min((t-lastTime)/1000||0,.033);lastTime=t;update(dt);render();requestAnimationFrame(frame)}catch(e){showError(e)}}
function point(e){const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top}}
canvas.addEventListener('pointerdown',e=>{if(pointer)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);const start=point(e);audio();pointer={id:e.pointerId,start,end:{...start}}});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();pointer.end=point(e)});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;e.preventDefault();const start=pointer.start,end=point(e);pointer=null;const distance=Math.hypot(end.x-start.x,end.y-start.y);if(distance>=12){const before=pieces.length;cut(start,end);playWhoosh();if(pieces.length>before){playSlice();addCutEffects(start,end)}trail=[{...start,life:.23},{...end,life:.23}]}});
canvas.addEventListener('pointercancel',e=>{if(pointer?.id===e.pointerId)pointer=null});
const settingsPanel=document.querySelector('#settingsPanel'),settingsButton=document.querySelector('#settings');
function setSettingsOpen(open){if(open&&typeof skinsPanel!=='undefined')skinsPanel.hidden=true;settingsPanel.hidden=!open;settingsButton.setAttribute('aria-expanded',String(open));pointer=null}
const soundToggle=document.querySelector('#soundToggle');function updateSound(){soundToggle.textContent='Sound: '+(soundEnabled?'On':'Off')}soundToggle.addEventListener('click',()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('cuto-sound',soundEnabled?'on':'off')}catch(e){}if(soundEnabled)tone(600,.12);updateSound()});updateSound();
settingsButton.addEventListener('click',()=>setSettingsOpen(settingsPanel.hidden));
document.querySelector('#closeSettings').addEventListener('click',()=>setSettingsOpen(false));
function updateSwatches(){document.querySelectorAll('[data-bg]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.bg===background)))}
document.querySelectorAll('[data-bg]').forEach(el=>el.addEventListener('click',()=>{background=el.dataset.bg;try{localStorage.setItem('cuto-background',background)}catch(e){}updateSwatches()}));updateSwatches();
document.querySelector('#back').addEventListener('click',()=>{if(!settingsPanel.hidden){setSettingsOpen(false);return}if(!skinsPanel.hidden){setSkinsOpen(false);return}if(fruitHistory.length){fruitIndex=fruitHistory.pop();spawn(false)}else spawn(false)});
const skinsPanel=document.querySelector('#skinsPanel');function setSkinsOpen(open){skinsPanel.hidden=!open;pointer=null;if(open)setSettingsOpen(false)}
document.querySelector('#skins').addEventListener('click',()=>setSkinsOpen(skinsPanel.hidden));
document.querySelector('#closeSkins').addEventListener('click',()=>setSkinsOpen(false));
function fillSkins(id,items,kind){const host=document.querySelector('#'+id);host.replaceChildren();for(const [name,color] of Object.entries(items)){const button=document.createElement('button');button.textContent=name;button.style.borderColor=(kind==='knife'?knifeSkin:plateSkin)===name?'white':'transparent';button.addEventListener('click',()=>{if(kind==='knife'){knifeSkin=name;try{localStorage.setItem('cuto-knife',name)}catch(e){}}else{plateSkin=name;try{localStorage.setItem('cuto-plate',name)}catch(e){}}fillSkins('knifeOptions',knifeSkins,'knife');fillSkins('plateOptions',plateSkins,'plate')});host.appendChild(button)}}
fillSkins('knifeOptions',knifeSkins,'knife');fillSkins('plateOptions',plateSkins,'plate');
document.querySelector('#next').addEventListener('click',()=>spawn(true));document.querySelector('#reset').addEventListener('click',()=>spawn(false));
// Initialize independently of the rendering loop so failures are visible.
function showError(error){const box=document.getElementById('game-error')||document.createElement('pre');box.id='game-error';box.style.cssText='position:fixed;top:30%;left:5%;width:90%;white-space:pre-wrap;background:#5b1b35;color:white;padding:16px;border-radius:12px;z-index:20;font:13px monospace';box.textContent='Cuto rendering error: '+String(error&&error.stack||error);document.body.appendChild(box)}
window.addEventListener('error',e=>showError(e.error||e.message));
try{resize();spawn(false);render();requestAnimationFrame(frame)}catch(e){showError(e)}

</script></body></html>
