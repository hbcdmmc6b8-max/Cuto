name: Build CUTO app icons
on:
  push:
    paths:
      - icon.svg
      - .github/workflows/build-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to PNG sizes
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          for filename, size in [('apple-touch-icon.png',180),('icon-192.png',192),('icon-512.png',512)]:
              cairosvg.svg2png(url='icon.svg',write_to=filename,output_width=size,output_height=size)
          PY
      - name: Commit PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate native PNG app icons" && git push)
