name: Build CUTO app icons
on:
  push:
    paths:
      - icon.svg
      - 98B3AB27-2D37-4BE6-8495-C8A949F55DAA.png
      - .github/workflows/build-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to PNG sizes
        run: |
          python -m pip install cairosvg pillow
          python - <<'PY'
          import os, cairosvg
          from PIL import Image
          for filename, size in [('apple-touch-icon.png',180),('icon-192.png',192),('icon-512.png',512)]:
              if os.path.exists('98B3AB27-2D37-4BE6-8495-C8A949F55DAA.png'):
                  with Image.open('98B3AB27-2D37-4BE6-8495-C8A949F55DAA.png') as source:
                      source.convert('RGB').resize((size,size), Image.Resampling.LANCZOS).save(filename, 'PNG', optimize=True)
              else:
                  cairosvg.svg2png(url='icon.svg',write_to=filename,output_width=size,output_height=size)
          PY
      - name: Commit PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate native PNG app icons"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "PNG icons successfully pushed"
                exit 0
              fi
              sleep 3
            done
            echo "Could not push PNG icons after retries"
            exit 1
          fi
